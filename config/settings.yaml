# Meeting Knowledge Capture (H6) runtime configuration.
#
# Loaded by `src/meeting_capture/config.py`. Point at a different file with
# MEETCAP_SETTINGS; a path that is named but missing is a boot error, not
# a silent fall-back to built-in defaults.
#
# `${VAR}` and `${VAR:-default}` resolve in THREE states: unset takes the default written here,
# SET-AND-EMPTY resolves to empty (an operator who emptied a value expressed an intent, and it
# names nothing), and a set value wins. This file holds env var NAMES and non-secret defaults
# only: no secret value is ever committed here.

# Data residency. Selected once and shared by the runtime and Terraform.
region: ${GCP_REGION:-asia-southeast1}

# Tenant partition asserted on outbound reviews when the verified principal carries none.
# (Built as one template expression: a literal "${" immediately before a template opener is
# ambiguous to render, so the whole reference is produced by the expression instead.)
tenant: ${MEETCAP_TENANT:-}

# Local profile stores. ":memory:" is the ephemeral, deterministic default the gate uses; a
# deployment points this at a durable path.
audit_path: ${MEETCAP_AUDIT_PATH:-:memory:}

# The external head anchor for the WORM audit chain (practices check C9). The hash chain cannot
# detect a TRUNCATED TAIL by itself: dropping the newest rows leaves a shorter chain that
# verifies perfectly. Point this at a file on a DIFFERENT volume, under different credentials,
# from audit_path, and every append also writes the chain head there. Empty (the default) means
# no anchor, which is correct for the ephemeral ":memory:" store and wrong for a durable one.
audit_anchor_path: ${MEETCAP_AUDIT_ANCHOR:-}

# The audience the managed (gcp) IAP identity adapter verifies the assertion AGAINST: the
# IAP-protected resource, "/projects/<NUM>/global/backendServices/<ID>" behind an HTTPS load
# balancer. It is per-deployment, so it is configuration and never a literal in the adapter.
# Three states, and UNSET and SET-AND-EMPTY land in the same place on purpose: both resolve to
# empty, and an empty audience REFUSES every caller rather than verifying without one.
# google-auth documents audience=None as "the audience is not verified", which accepts ANY
# Google-signed OIDC token, from any project or any app, and reads its email as a principal.
iap_audience: ${MEETCAP_IAP_AUDIENCE:-}

# Rule R8: where an escalated result is routed for human review. The managed profile REFUSES to
# swallow an escalation when this is empty, so a producer cannot ship with R8 unwired.
# The outbound S2S credentials are HUMAN_REVIEW_S2S_TOKEN / HUMAN_REVIEW_S2S_SIGNING_KEY (see .env.secrets.example),
# deliberately distinct from this service's own inbound MEETCAP_S2S_TOKEN.
review_url: ${HUMAN_REVIEW_URL:-}

# The per-port adapter map: the ONLY place a binding lives, so switching the whole stack is a
# configuration change rather than a code edit. Every port must bind every profile; the loader
# refuses a partial block and `tests/test_settings_file.py` fails the build if this drifts from
# `config.DEFAULT_BINDINGS`.
project_id: ${GOOGLE_CLOUD_PROJECT:-}

adapters:
  audit:
    local: meeting_capture.adapters.local.audit:LocalAuditAdapter
    gcp: meeting_capture.adapters.gcp.audit:CloudAuditAdapter
    onprem: meeting_capture.adapters.onprem.audit:OnPremAuditAdapter
  identity:
    local: meeting_capture.adapters.local.identity:LocalIdentityAdapter
    gcp: meeting_capture.adapters.gcp.identity:IapIdentityAdapter
    onprem: meeting_capture.adapters.onprem.identity:OnPremIdentityAdapter
  review_router:
    local: meeting_capture.adapters.local.review_router:LocalReviewRouter
    gcp: meeting_capture.adapters.gcp.review_router:CloudReviewRouter
    onprem: meeting_capture.adapters.onprem.review_router:OnPremReviewRouter

  # Tracing. Which BACKEND a deployed profile exports to is not a binding: the gcp
  # adapter reads OTEL_EXPORTER_OTLP_ENDPOINT and sends OTLP to the agent-observability collector when it
  # is set, straight to Cloud Trace when it is not. Tracing is not essential to
  # correctness, so onprem is ABSENT rather than fatal, unlike the other placeholders.
  tracer:
    local: meeting_capture.adapters.local.tracer:LocalNoopTracerAdapter
    gcp: meeting_capture.adapters.gcp.tracer:CloudTracerAdapter
    onprem: meeting_capture.adapters.onprem.tracer:OnPremTracerAdapter

  # The promotion authority (model-quality-gate). The local adapter scores offline but REFUSES to
  # promote: a promotion certified by a laptop with no quality service is certified by
  # nothing.
  evaluation:
    local: meeting_capture.adapters.local.evaluation:LocalOfflineEvalAdapter
    gcp: meeting_capture.adapters.gcp.evaluation:ManagedEvalGateAdapter
    onprem: meeting_capture.adapters.onprem.evaluation:OnPremEvalAdapter
  # Transcript ingestion (slice 2): speech-to-text and diarization ports re-exported from the
  # shared speech-lexicon-kit. local replays fixture transcripts; gcp is Cloud Speech-to-Text v2
  # (SDK lazy); onprem is the client-provided recognizer placeholder.
  transcription:
    local: meeting_capture.adapters.local.transcription:LocalTranscriptionAdapter
    gcp: meeting_capture.adapters.gcp.transcription:CloudTranscriptionAdapter
    onprem: meeting_capture.adapters.onprem.transcription:OnPremTranscriptionAdapter
  diarization:
    local: meeting_capture.adapters.local.diarization:LocalDiarizationAdapter
    gcp: meeting_capture.adapters.gcp.diarization:CloudDiarizationAdapter
    onprem: meeting_capture.adapters.onprem.diarization:OnPremDiarizationAdapter
  # The model seam (slices 3 and 5): it narrates and extracts only; the engine owns every number.
  # local is a deterministic stub, gcp is Gemini (SDK lazy), onprem is the client-hosted model.
  generation:
    local: meeting_capture.adapters.local.generation:LocalGenerationAdapter
    gcp: meeting_capture.adapters.gcp.generation:CloudGenerationAdapter
    onprem: meeting_capture.adapters.onprem.generation:OnPremGenerationAdapter
  # The enterprise-knowledge-base governed corpus (slice 5): review-approved minutes publish here and become
  # retrievable with citations. local is in-memory, gcp is Vertex AI Search (SDK lazy).
  corpus:
    local: meeting_capture.adapters.local.corpus:LocalCorpusAdapter
    gcp: meeting_capture.adapters.gcp.corpus:CloudCorpusAdapter
    onprem: meeting_capture.adapters.onprem.corpus:OnPremCorpusAdapter
  # External task/calendar routing over A2A/MCP (slice 6): only review-approved consequential
  # entries route. local is an in-memory store, gcp is Cloud Tasks (SDK lazy).
  task_router:
    local: meeting_capture.adapters.local.task_router:LocalTaskRouterAdapter
    gcp: meeting_capture.adapters.gcp.task_router:CloudTaskRouterAdapter
    onprem: meeting_capture.adapters.onprem.task_router:OnPremTaskRouterAdapter
